# Response headers for every file of the app (spec §11). Included in each location because nginx
# drops inherited add_header directives in any block that sets its own.
# The CSP must equal CSP_HEADER in packages/bridge/src/csp.ts (a test checks it).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; worker-src 'self' blob:; connect-src 'self' http://127.0.0.1:*; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
# Your own headers (e.g. HSTS), from deploy/local-headers.conf if it exists; git ignores that file.
include /etc/nginx/margin/local-headers*.conf;
