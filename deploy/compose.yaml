# docker compose -f deploy/compose.yaml up -d --build   →  http://localhost:8080
# Put a TLS-terminating proxy in front for anything but localhost (see docs/deployment.md).
services:
  margin:
    build:
      context: ..
      dockerfile: Dockerfile
    image: margin:latest
    # Always build locally; there is no published image to pull.
    pull_policy: build
    ports:
      # For a reverse proxy running on the host: proxy_pass http://127.0.0.1:8080;
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # For a reverse proxy running in another container: put both on one network and use
    # proxy_pass http://margin:8080; (create it once with: docker network create proxy)
    # networks: [proxy]

# networks:
#   proxy:
#     external: true
