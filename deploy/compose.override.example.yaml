# Local additions to compose.yaml. Copy to compose.override.yaml (not tracked by git) and edit;
# `docker compose up -d --build` run in this directory loads both files.
services:
  margin:
    # Always build locally; there is no published image to pull.
    pull_policy: build
    # Reachable as http://margin:8080 for a reverse proxy container on the same network
    # (create it once with: docker network create proxy).
    networks: [proxy]

networks:
  proxy:
    external: true
