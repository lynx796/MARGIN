# Margin: static files only (spec §11). There is no endpoint that accepts data: every method but
# GET and HEAD is refused, and nothing is proxied anywhere.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # The app sends no data to the server, but request lines still carry client IPs and user agents.
    # Off by default; enable it (e.g. to /dev/stdout) only if you need it, and say so in your privacy notice.
    access_log off;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/wasm font/ttf;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Hashed build output: cache forever.
    location /assets/ {
        include /etc/nginx/margin/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        location ~ \.mjs$ {
            types { }
            default_type text/javascript;
            include /etc/nginx/margin/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        try_files $uri =404;
    }

    # The service worker and the manifest must be revalidated so a new deployment is picked up.
    location = /sw.js {
        include /etc/nginx/margin/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/margin/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/margin/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
